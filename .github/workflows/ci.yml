name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go vet ./...
      - name: unit tests with the race detector
        run: go test -race -short -count=1 ./...
      - name: kill/restart test with real processes
        run: go test -count=1 -v ./test/e2e
      - name: seed sweep
        run: go run ./cmd/conclave sim -seeds 1-500 -workers 4

  mutations:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: every injected bug is detected within its seed bound
        run: go test -count=1 -v -timeout 80m -run TestMutationsAreDetected ./internal/sim

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - name: go mod tidy
        run: go mod tidy && git diff --exit-code go.mod
